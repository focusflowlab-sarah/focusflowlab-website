:root{
  --bg:#FDFBF7; --surface:#FFFFFF; --sand:#F2EBE1; --sand-2:#E7DCCD;
  --text:#3E2723; --muted:#6D5A54;
  --accent:#722F37; --accent-fill:#722F37; --on-accent:#FDFBF7;
  --gold:#D4AF37; --gold-soft:#F7EDCD;
  --p-men:#722F37; --p-fol:#E3BDBD; --p-ovu:#D4AF37; --p-lut:#B08968; --p-pre:#6B4A3E; --p-late:#CFC4BC;
  --lv0:#F2EBE1; --lv1:#E8938D; --lv2:#F0B49C; --lv3:#F6D68E; --lv4:#DCE8AC; --lv5:#93CBA0;
  --radius-lg:22px; --radius:14px; --radius-sm:10px;
  --focus:0 0 0 3px #FDFBF7, 0 0 0 6px #722F37;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1D1513; --surface:#281E1B; --sand:#3A2D29; --sand-2:#4A3A35;
    --text:#F2EBE1; --muted:#C2B2AA;
    --accent:#E0A2AA; --accent-fill:#8A3B45; --on-accent:#FDFBF7;
    --gold-soft:#3F3420;
    --p-men:#B24E5A; --p-fol:#D8AFAF; --p-ovu:#D4AF37; --p-lut:#B08968; --p-pre:#8C6A5C; --p-late:#5A4C46;
    --lv0:#3A2D29; --lv1:#C97F79; --lv2:#D49C86; --lv3:#D9BC78; --lv4:#BFCB93; --lv5:#7FB08D;
    --focus:0 0 0 3px #1D1513, 0 0 0 6px #E0A2AA;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}
header.top{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0 8px}
.brand{font-weight:700;color:var(--accent);text-decoration:none;font-size:18px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.saved{font-size:14px;color:var(--muted)}

h1{font-size:28px;line-height:1.15;margin:6px 0 16px;font-weight:700}
h2{font-size:20px;line-height:1.25;margin:0 0 12px;font-weight:600}
h3{font-size:17px;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--surface);border:1px solid var(--sand);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.quiet{background:transparent;border:1px dashed var(--sand-2)}

/* datum-navigatie */
.daynav{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.daynav .lbl{flex:1;text-align:center;font-weight:600;font-size:18px}
.daynav .lbl span{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--sand-2);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px 0;font-size:15px}

/* cycluswiel */
.cycle{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;display:block}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .center b{font-size:40px;font-weight:700}
.ring .center span{font-size:13px;color:var(--muted);margin-top:4px}
.phase-name{font-size:22px;font-weight:700;line-height:1.2;margin:0}
.phase-season{color:var(--muted);margin:2px 0 8px}
.phase-hint{font-size:15px;margin:0}
details.more{margin-top:14px;border-top:1px solid var(--sand);padding-top:10px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";font-weight:700}
details.more[open] summary::before{content:"− "}
.phase-detail dt{font-weight:600;margin-top:10px}
.phase-detail dd{margin:2px 0 0}
.disclaimer{font-size:13px;color:var(--muted);margin-top:12px}
@media (max-width:420px){.cycle{grid-template-columns:1fr;justify-items:center;text-align:center}.ring{width:170px;height:170px}}

/* keuzes */
.q{margin-bottom:22px}
.q h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.q h2 .linkbtn{font-size:14px;font-weight:400;padding:0}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale .opt{padding:8px 2px;font-size:13px;hyphens:manual}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:400px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}}
.opt{min-height:78px;border:2px solid var(--sand);background:var(--surface);border-radius:var(--radius);padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:13.5px;line-height:1.15;transition:border-color .15s,background .15s}
.opt .e{font-size:26px;line-height:1}
.opt:hover{border-color:var(--sand-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--gold-soft);font-weight:600}
.help{margin-top:10px;font-size:14.5px;background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px}
.help dt{font-weight:600}
.help dd{margin:0 0 8px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--sand-2);background:var(--surface);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.field{margin-top:16px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:16px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;background:var(--bg);border:1.5px solid var(--sand-2);border-radius:var(--radius-sm);padding:12px;font-size:16px}
textarea{min-height:88px;resize:vertical}

.btn{min-height:50px;padding:12px 20px;border-radius:999px;border:0;background:var(--accent-fill);color:var(--on-accent);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:transparent;color:#A3262F;border:1.5px solid #A3262F}
@media (prefers-color-scheme: dark){.btn.danger{color:#F08A92;border-color:#F08A92}}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--sand)}
.toggle:last-child{border-bottom:0}
.toggle span small{display:block;color:var(--muted);font-size:14px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--sand-2);position:relative;flex:none;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch:checked{background:var(--accent-fill)}
.switch:checked::after{transform:translateX(22px)}

.cta{background:var(--accent-fill);color:var(--on-accent);border:0}
.cta a{color:var(--on-accent);font-weight:600}

/* maand */
.monthhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthhead b{font-size:20px;text-transform:none}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:13px;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1/1.1;border-radius:10px;border:0;background:var(--lv0);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;padding:0}
.day.out{visibility:hidden}
.day .cd{font-size:10px;opacity:.75;position:absolute;top:3px;right:5px}
.day .drop{position:absolute;bottom:4px;width:7px;height:7px;border-radius:50%;background:var(--p-men);box-shadow:0 0 0 1.5px var(--surface)}
.day.today{box-shadow:inset 0 0 0 2.5px var(--text)}
.day.pred{outline:2px dashed var(--p-men);outline-offset:-3px}
.day.lv1{background:var(--lv1)}.day.lv2{background:var(--lv2)}.day.lv3{background:var(--lv3)}
.day.lv4{background:var(--lv4)}.day.lv5{background:var(--lv5)}
.day.lv1,.day.lv2,.day.lv3,.day.lv4,.day.lv5{color:#3E2723}
@media (prefers-color-scheme: dark){.day.lv1,.day.lv2,.day.lv3,.day.lv4,.day.lv5{color:#1D1513}}
.day.lv1 .drop,.day.lv2 .drop,.day.lv3 .drop,.day.lv4 .drop,.day.lv5 .drop{background:#722F37;box-shadow:0 0 0 1.5px #FDFBF7}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:5px}

/* patronen */
.chart{overflow-x:auto;margin:6px -4px 0;padding:0 4px}
.chart svg{display:block;width:100%;height:auto}
.phases{list-style:none;margin:0;padding:0}
.phases li{padding:12px 0;border-bottom:1px solid var(--sand)}
.phases li:last-child{border-bottom:0}
.phases .ph{font-weight:600}
.phases dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 0;font-size:15px}
.phases dt{color:var(--muted)}
.phases dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--sand);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.progress{height:10px;background:var(--sand);border-radius:999px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--gold)}

/* navigatie */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--sand);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted)}
nav.tabs button .e{font-size:21px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs button[aria-current="page"] .e{transform:translateY(-1px)}

/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{height:6px;flex:1;border-radius:999px;background:var(--sand)}
.steps i.on{background:var(--accent-fill)}
.radio{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--sand);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;background:var(--surface)}
.radio:has(input:checked){border-color:var(--accent);background:var(--gold-soft)}
.radio input{margin-top:5px;accent-color:var(--accent-fill);width:18px;height:18px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.warn{background:var(--gold-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;margin-bottom:16px}

/* prikkelarme modus */
body.calm .e{display:none}
body.calm{--p-men:#8C7B74;--p-fol:#D9CFC7;--p-ovu:#BFB2A8;--p-lut:#A89A91;--p-pre:#7A6B64;--gold-soft:var(--sand)}
body.calm{--lv1:#D9A7A3;--lv2:#E3C2B2;--lv3:#EBDDB5;--lv4:#DDE4C3;--lv5:#B5D0BC}
@media (prefers-color-scheme: dark){body.calm{--lv1:#B28D89;--lv2:#B39A8E;--lv3:#B8AD8A;--lv4:#A5AD94;--lv5:#86A08F}}
body.calm *{transition:none!important}
body.calm .opt{min-height:56px;font-size:15px}
body.calm nav.tabs button{font-size:15px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>

<script>
(function(){
"use strict";

/* ---------- opslag: alleen op dit toestel ---------- */
/* TESTVERSIE: vul hier de link naar het feedbackformulier in (leeg = geen link zichtbaar) */
var FEEDBACK_URL = '';
var KEY = 'ffl-cyclustracker-v1';
var storageOk = true;
try { localStorage.setItem('__ffl', '1'); localStorage.removeItem('__ffl'); } catch(e){ storageOk = false; }
function loadData(){
  if(!storageOk) return null;
  try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function persist(){
  if(!storageOk) return false;
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch(e){ return false; }
}

var DEFAULTS = { version:1, settings:{ onboarded:false, lastPeriodStart:null, cycleLength:28, noCycle:false, calm:false, meds:true }, entries:{} };
var stored = loadData();
var data = { version:1, settings:Object.assign({}, DEFAULTS.settings, stored && stored.settings), entries:(stored && stored.entries) || {} };

/* ---------- inhoud ---------- */
var ENERGY = [
  {v:1, e:'🪫', name:'Zombie',       d:'Batterij bijna leeg. Overleven is vandaag genoeg.'},
  {v:2, e:'🐢', name:'Traag',        d:'Alles voelt zwaarder. Kleine stapjes, enkel het hoognodige.'},

];
var FOCUS = [
  {id:'flow',   e:'✨', name:'In de flow',  d:'Precies genoeg prikkel. Je bent scherp en het loopt vanzelf.'},
  {id:'hyper',  e:'🧠', name:'Hyperfocus',  d:'Vast op één ding. Productief, maar zonder rem: eten, drinken en pauzes schieten erbij in.'},
  {id:'oke',    e:'🙂', name:'Gewoon oké',  d:'Geen uitschieters. Een doodgewone, werkbare dag telt ook.'},
  {id:'eek',    e:'🐿️', name:'Eekhoorn',    d:'Honderd tabbladen open. Veel energie, maar versnipperd. Let op impulsaankopen.'},
  {id:'potato', e:'☁️', name:'Potato',      d:'Brain fog. Denken gaat traag en informatie verwerken kost extreem veel moeite.'},
  {id:'rsd',    e:'🤬', name:'Prikkelbaar', d:'Je emotionele filter is flinterdun. Geluiden en opmerkingen komen harder binnen (RSD).'}

var TAGS = ['slecht geslapen','krampen of pijn','hoofdpijn','cravings','overprikkeld','sociale kater','onrustig','somber','creatief','rustig'];

var PHASES = {

    feel:'Hoe voel jij je in deze dagen? Noteer het in je check-in, dan zie je het straks in je eigen gegevens.',

  fol:{name:'Folliculaire fase', season:'lente', e:'🌱',
    hint:'Zet hier taken die opstartenergie vragen.',
    body:'Oestrogeen stijgt. Oestrogeen kan invloed hebben op dopamine in je brein. Hoe sterk dat meespeelt, verschilt per vrouw. Dit is een schatting op basis van jouw cyclusduur.',

    tip:'Iets nieuws beginnen, plannen maken, die lastige mail eindelijk versturen.'},
  ovu:{name:'Eisprongvenster (schatting)', season:'zomer', e:'☀️',
    hint:'Leuk voor afspraken, maar zeg niet overal ja op.',
    body:'Oestrogeen is rond je eisprong het hoogst. Dit is een schatting op basis van jouw cyclusduur.',
    feel:'Hoe voel jij je in deze dagen? Noteer het in je check-in, dan zie je het straks in je eigen gegevens.',
    tip:'Plan zichtbare of sociale dingen. Check wel of wat je nu toezegt niet in je premenstruele dagen valt.'},
  lut:{name:'Luteale fase', season:'herfst', e:'🍂',
    hint:'Afronden gaat vaak beter dan starten.',
    body:'Progesteron stijgt, oestrogeen daalt eerst en stijgt daarna licht. Dit is een schatting op basis van jouw cyclusduur.',
    feel:'Hoe voel jij je in deze dagen? Noteer het in je check-in, dan zie je het straks in je eigen gegevens.',

  late:{name:'Later dan verwacht', season:'', e:'⏳',
    hint:'Duid je bloeding aan zodra je menstruatie begint.',
    body:'Je cyclus duurt langer dan je gemiddelde.',
    feel:'Dat gebeurt, zeker bij stress, ziekte, reizen of een onregelmatige cyclus.',
    tip:'Begint je menstruatie? Open "meer bijhouden" en duid je bloeding aan, dan rekent de tracker verder.'}
};
var PHASE_ORDER = ['men','fol','ovu','lut','pre'];

/* ---------- datums (lokale tijd, geen UTC-verschuiving) ---------- */
function pad(n){ return (n<10?'0':'') + n; }
function fmt(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayStr(){ return fmt(new Date()); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return fmt(d); }
function diff(a, b){ var A = parse(a), B = parse(b);
  return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate())) / 864e5); }
var DAYS = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
var MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function longDate(s){ var d = parse(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function shortDate(s){ var d = parse(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }

/* ---------- cyclusberekening ---------- */
function isBleeding(e){ return e && e.bleeding && e.bleeding !== 'geen'; }
function periodStarts(){
  var bleed = Object.keys(data.entries).filter(function(k){ return isBleeding(data.entries[k]); }).sort();
  var cand = [];
  if(data.settings.lastPeriodStart) cand.push(data.settings.lastPeriodStart);
  bleed.forEach(function(d){
    var continued = bleed.some(function(o){ return o < d && diff(o, d) <= 10; });
    if(!continued) cand.push(d);
  });
  cand.sort();
  var out = [];
  cand.forEach(function(d){ if(!out.length || diff(out[out.length-1], d) > 10){ if(out.indexOf(d) < 0) out.push(d); } });
  return out;
}
function cycleStats(starts){
  var ds = [];
  for(var i=1;i<starts.length;i++){ var x = diff(starts[i-1], starts[i]); if(x >= 18 && x <= 60) ds.push(x); }
  if(ds.length){
    var recent = ds.slice(-6);
    var avg = Math.round(recent.reduce(function(a,b){return a+b;},0) / recent.length);
    return { len:avg, measured:recent.length, min:Math.min.apply(null,recent), max:Math.max.apply(null,recent) };
  }
  return { len: clamp(+data.settings.cycleLength || 28, 18, 60), measured:0 };
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function phaseFor(cd, L, bleeding){
  if(bleeding && cd <= 8) return 'men';
  if(cd <= 5) return 'men';
  var ovS = Math.max(7, L-16), ovE = Math.max(9, L-12);
  if(cd < ovS) return 'fol';
  if(cd <= ovE) return 'ovu';
  if(cd <= L-5) return 'lut';
  if(cd <= L+7) return 'pre';
  return 'late';
}
function cycleInfo(date){
  if(data.settings.noCycle) return null;
  var starts = periodStarts();
  var past = starts.filter(function(s){ return s <= date; });
  if(!past.length) return null;
  var stats = cycleStats(starts);
  var start = past[past.length-1];
  var cd = diff(start, date) + 1;
  return { start:start, cd:cd, len:stats.len, stats:stats, phase:phaseFor(cd, stats.len, isBleeding(data.entries[date])), starts:starts };
}

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function entry(date){ return data.entries[date] || {}; }
function setEntry(date, patch){
  var e = Object.assign({}, data.entries[date], patch);
  var empty = !e.energy && !e.focus && !e.bleeding && !e.meds && !(e.tags && e.tags.length) && !e.win && !e.note;
  if(empty) delete data.entries[date]; else data.entries[date] = e;
  var ok = persist();
  flash(ok ? 'Bewaard op dit toestel' : 'Niet bewaard: exporteer je gegevens');
}
var toastTimer;
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800); }
function flash(msg){ var s = document.getElementById('savedState'); if(s){ s.textContent = '✓ ' + msg; } }
function energyName(v){ var f = ENERGY.filter(function(x){return x.v===Math.round(v);})[0]; return f ? f.name.replace('&shy;','') : ''; }

/* ---------- toestand ---------- */
var view = 'today';
var selDate = todayStr();
var monthCursor = todayStr().slice(0,7);
var onbStep = 0;
var onbChoice = 'weet';

/* ---------- render ---------- */
var app = document.getElementById('app');
function render(){
  document.body.classList.toggle('calm', !!data.settings.calm);
  if(!data.settings.onboarded){ app.innerHTML = renderOnboarding(); return; }
  var html = '<div class="wrap">' +
    '<header class="top"><a class="brand" href="index.html">FocusFlow Lab<small>energie- en cyclustracker</small></a>' +
    '<span class="saved" id="savedState" aria-live="polite"></span></header>';
  if(!storageOk) html += '<div class="warn">Je browser blokkeert opslaan (bv. privévenster). Wat je invult verdwijnt als je deze pagina sluit. Open de tracker in een gewoon venster.</div>';
  if(view === 'today') html += renderToday();
  if(view === 'month') html += renderMonth();
  if(view === 'patterns') html += renderPatterns();
  if(view === 'settings') html += renderSettings();
  html += '</div>' + renderNav();
  app.innerHTML = html;
}

function renderNav(){
  var items = [['today','🌤️','Vandaag'],['month','🗓️','Maand'],['patterns','📈','Patronen'],['settings','⚙️','Instellingen']];
  return '<nav class="tabs" aria-label="Hoofdmenu"><div class="in">' + items.map(function(i){
    return '<button data-act="view" data-v="'+i[0]+'"'+(view===i[0]?' aria-current="page"':'')+'><span class="e" aria-hidden="true">'+i[1]+'</span>'+i[2]+'</button>';
  }).join('') + '</div></nav>';
}

/* ---- vandaag ---- */
function renderToday(){
  var t = todayStr();
  var e = entry(selDate);
  var label = selDate === t ? 'Vandaag' : (selDate === addDays(t,-1) ? 'Gisteren' : longDate(selDate).replace(/^./, function(c){return c.toUpperCase();}));
  var sub = selDate === t || selDate === addDays(t,-1) ? longDate(selDate) : '';
  var h = '<div class="daynav">' +
    '<button class="iconbtn" data-act="day" data-n="-1" aria-label="Vorige dag">‹</button>' +
    '<div class="lbl" aria-live="polite">'+esc(label)+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>' +
    '<button class="iconbtn" data-act="day" data-n="1" aria-label="Volgende dag"'+(selDate>=t?' disabled':'')+'>›</button></div>';
  if(selDate !== t) h += '<p style="text-align:center;margin-top:-10px"><button class="linkbtn" data-act="gotoday">Terug naar vandaag</button></p>';

  h += renderCycleCard();

  h += '<section class="card" aria-labelledby="q1"><div class="q"><h2 id="q1">Hoe is je batterij? <button class="linkbtn" data-act="help" data-v="h1" aria-expanded="false">uitleg</button></h2>' +
    '<div class="scale" role="group" aria-labelledby="q1">' + ENERGY.map(function(o){
      return '<button class="opt" data-act="energy" data-v="'+o.v+'" aria-pressed="'+(e.energy===o.v)+'"><span class="e" aria-hidden="true">'+o.e+'</span>'+o.name+'</button>';
    }).join('') + '</div>' +
    '<dl class="help" id="h1" hidden>' + ENERGY.map(function(o){ return '<dt>'+o.e+' '+o.name+'</dt><dd>'+o.d+'</dd>'; }).join('') + '</dl></div>';

  h += '<div class="q" style="margin-bottom:0"><h2 id="q2">Hoe voelt je hoofd? <button class="linkbtn" data-act="help" data-v="h2" aria-expanded="false">uitleg</button></h2>' +
    '<div class="modes" role="group" aria-labelledby="q2">' + FOCUS.map(function(o){
      return '<button class="opt" data-act="focus" data-v="'+o.id+'" aria-pressed="'+(e.focus===o.id)+'"><span class="e" aria-hidden="true">'+o.e+'</span>'+o.name+'</button>';
    }).join('') + '</div>' +
    '<dl class="help" id="h2" hidden>' + FOCUS.map(function(o){ return '<dt>'+o.e+' '+o.name+'</dt><dd>'+o.d+'</dd>'; }).join('') + '</dl></div>';

  var hasExtra = isBleeding(e) || e.meds || (e.tags && e.tags.length) || e.win || e.note;
  h += '<details class="more"'+(hasExtra?' open':'')+'><summary>Meer bijhouden (optioneel)</summary>';
  if(!data.settings.noCycle){
    h += '<div class="field"><label id="lb">Bloeding</label><div class="seg" role="group" aria-labelledby="lb">' + BLEED.map(function(b){
      var on = (e.bleeding || 'geen') === b.id && (b.id !== 'geen' || e.bleeding === 'geen');
      return '<button class="chip" data-act="bleed" data-v="'+b.id+'" aria-pressed="'+on+'">'+b.name+'</button>';
    }).join('') + '</div></div>';
  }
  if(data.settings.meds){
    h += '<div class="field"><label id="lm">Medicatie genomen?</label><div class="seg" role="group" aria-labelledby="lm">' +
      [['ja','Ja'],['nee','Nee'],['later','Later dan normaal']].map(function(m){
        return '<button class="chip" data-act="meds" data-v="'+m[0]+'" aria-pressed="'+(e.meds===m[0])+'">'+m[1]+'</button>';
      }).join('') + '</div></div>';
  }
  h += '<div class="field"><label id="lt">Wat speelde er mee?</label><div class="seg" role="group" aria-labelledby="lt">' + TAGS.map(function(tg){
    var on = (e.tags||[]).indexOf(tg) > -1;
    return '<button class="chip" data-act="tag" data-v="'+esc(tg)+'" aria-pressed="'+on+'">'+esc(tg)+'</button>';
  }).join('') + '</div></div>';
  h += '<div class="field"><label for="win">Eén ding dat gelukt is</label><input type="text" id="win" data-input="win" maxlength="140" value="'+esc(e.win)+'" placeholder="Hoe klein ook: tanden gepoetst telt"></div>';
  h += '<div class="field"><label for="note">Notitie</label><textarea id="note" data-input="note" maxlength="1000" placeholder="Cravings, triggers, wat je energie kostte of gaf...">'+esc(e.note)+'</textarea></div>';
  h += '</details></section>';

  h += '<p class="small muted" style="text-align:center">Dagen overslaan is normaal. Een lege dag is geen mislukte dag.</p>';
  h += '<section class="card cta"><h3>Wil je dat je planning zich aanpast aan je energie?</h3><p class="small" style="margin-bottom:8px">Deze tracker is een voorproefje van de FocusFlow Lab app. Wil je als eerste weten wanneer die er is?</p><a href="https://focusflowlab.be/wachtlijst.html" target="_blank" rel="noopener">Zet me op de wachtlijst</a></section>';
  return h;
}

function renderCycleCard(){

function polar(cx, cy, r, deg){ var a = (deg-90) * Math.PI/180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function arcPath(cx, cy, r, a0, a1){
  var p0 = polar(cx,cy,r,a0), p1 = polar(cx,cy,r,a1);
  return 'M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2);
}
function ringSVG(L, cd){
  var c = 100, r = 80, gap = L > 36 ? 1.2 : 2.2, s = '';
  var cur = Math.min(cd, L);
  for(var i=1;i<=L;i++){
    var a0 = (i-1)/L*360 + gap/2, a1 = i/L*360 - gap/2;
    s += '<path d="'+arcPath(c,c,r,a0,a1)+'" stroke="var(--p-'+phaseFor(i,L,false)+')" stroke-width="20" fill="none"'+(i>cur?' opacity=".3"':'')+'/>';
  }
  var m = polar(c,c,r,(cur-0.5)/L*360);
  s += '<circle cx="'+m[0].toFixed(2)+'" cy="'+m[1].toFixed(2)+'" r="14" fill="var(--surface)" stroke="var(--text)" stroke-width="3"/>';
  return '<svg viewBox="0 0 200 200" aria-hidden="true">'+s+'</svg>';
}

function renderMonth(){

  if(starts.length){
    nextStart = addDays(starts[starts.length-1], stats.len);
    while(nextStart < t && diff(nextStart, t) > 7) nextStart = addDays(nextStart, stats.len);
    for(var k=0;k<5;k++) predicted[addDays(nextStart,k)] = true;
  }
  var h = '<h1>Maand</h1><section class="card"><div class="monthhead">' +
    '<button class="iconbtn" data-act="month" data-n="-1" aria-label="Vorige maand">‹</button><b aria-live="polite">'+MONTHS[mo]+' '+y+'</b>' +

    var cls = 'day' + (e.energy ? ' lv'+e.energy : '') + (ds === t ? ' today' : '') + (predicted[ds] && ds > t && !isBleeding(e) ? ' pred' : '');
    var aria = longDate(ds) + (e.energy ? ', batterij ' + energyName(e.energy) : ', niets ingevuld') + (isBleeding(e) ? ', bloeding' : '') + (ci ? ', cyclusdag ' + ci.cd : '');
    h += '<button class="'+cls+'" data-act="open" data-v="'+ds+'" aria-label="'+esc(aria)+'"'+(ds>t?' disabled':'')+'>' +

  }

  if(!data.settings.noCycle) h += '<span><i style="background:var(--p-men);border-radius:50%;width:10px;height:10px;vertical-align:0"></i>bloeding</span><span><i style="outline:2px dashed var(--p-men);outline-offset:-3px;background:transparent"></i>verwacht</span><span>klein cijfer = cyclusdag</span>';

    var agg = {};

    rows.forEach(function(r){
      if(!r.ph || !agg[r.ph]) return;
      var a = agg[r.ph]; a.n++;
      if(r.e.energy){ a.sum += r.e.energy; a.en++; }

    PHASE_ORDER.forEach(function(p){

        '<dt>Hoofd</dt><dd>'+(fObj ? '<span class="e" aria-hidden="true">'+fObj.e+' </span>'+fObj.name : '<span class="muted">nog geen gegevens</span>')+'</dd>' +
        '<dt>Speelt vaak mee</dt><dd>'+(topT.length ? topT.map(function(x){ return esc(x[0]); }).join(', ') : '<span class="muted">niets aangeduid</span>')+'</dd></dl></li>';
    });

  }

  var wd = [0,0,0,0,0,0,0].map(function(){ return {sum:0,n:0}; });
  rows.forEach(function(r){ if(r.e.energy){ var i = (parse(r.d).getDay()+6)%7; wd[i].sum += r.e.energy; wd[i].n++; } });
  h += '<section class="card"><h2>Batterij per weekdag</h2>' + weekChart(wd) +

  h += '<section class="card quiet"><h3>Reflectievraag</h3><p style="margin:0">Kijk naar je zwaarste fase of dag. Wat zou je daar volgende keer <b>uit je agenda</b> kunnen halen, in plaats van harder je best te doen?</p></section>';
  return h;
}
function top(obj, k){ return Object.keys(obj).map(function(x){ return [x, obj[x]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,k); }

function cycleChart(rows, L){
  var maxD = Math.min(45, Math.max(L, rows.reduce(function(m,r){ return Math.max(m, r.cd); }, 0)));
  var byDay = {};
  rows.forEach(function(r){ if(r.cd <= maxD){ byDay[r.cd] = byDay[r.cd] || {s:0,n:0}; byDay[r.cd].s += r.e.energy; byDay[r.cd].n++; } });
  var bw = 12, left = 34, H = 150, top = 10, base = 120, W = left + maxD*bw + 6;
  var s = '';
  for(var lv=1; lv<=5; lv++){
    var y = base - (lv/5)*(base-top);
    s += '<line x1="'+left+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--sand)" stroke-width="1"/>';
  }
  s += '<text x="0" y="'+(top+4)+'" font-size="10" fill="var(--muted)">hoog</text><text x="0" y="'+(base)+'" font-size="10" fill="var(--muted)">laag</text>';
  for(var d=1; d<=maxD; d++){
    var x = left + (d-1)*bw;
    s += '<rect x="'+x+'" y="'+(base+4)+'" width="'+(bw-1)+'" height="6" fill="var(--p-'+phaseFor(d,L,false)+')"/>';
    if(byDay[d]){
      var avg = byDay[d].s / byDay[d].n, hgt = (avg/5)*(base-top);
      s += '<rect x="'+(x+1)+'" y="'+(base-hgt).toFixed(1)+'" width="'+(bw-3)+'" height="'+hgt.toFixed(1)+'" rx="2" fill="var(--accent-fill)" opacity="'+(byDay[d].n>1?1:.55)+'"><title>Dag '+d+': '+energyName(avg)+' ('+byDay[d].n+'×)</title></rect>';
    }
    if(d===1 || d%7===0) s += '<text x="'+(x+bw/2)+'" y="'+(H-4)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+d+'</text>';
  }
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gemiddelde batterij per cyclusdag. Gekleurde strook onderaan toont de geschatte fase.">'+s+'</svg></div>' +
    '<p class="small muted" style="margin:6px 0 0">Lichtere balken zijn gebaseerd op één enkele dag. De kleurstrook onderaan toont de geschatte fase.</p>';
}
function weekChart(wd){
  var names = ['ma','di','wo','do','vr','za','zo'], W = 280, H = 130, base = 100, top = 8, bw = 32, gap = 8, left = 6, s = '';
  wd.forEach(function(w,i){
    var x = left + i*(bw+gap);
    if(w.n){
      var avg = w.s = w.sum / w.n, hgt = (avg/5)*(base-top);
      s += '<rect x="'+x+'" y="'+(base-hgt).toFixed(1)+'" width="'+bw+'" height="'+hgt.toFixed(1)+'" rx="4" fill="var(--accent-fill)"><title>'+names[i]+': '+energyName(avg)+'</title></rect>';
    } else {
      s += '<rect x="'+x+'" y="'+(base-3)+'" width="'+bw+'" height="3" fill="var(--sand-2)"/>';
    }
    s += '<text x="'+(x+bw/2)+'" y="'+(H-10)+'" font-size="12" text-anchor="middle" fill="var(--muted)">'+names[i]+'</text>';
  });
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gemiddelde batterij per weekdag" style="max-width:340px">'+s+'</svg></div>';
}

function toCSV(){

  var head = ['datum','cyclusdag','fase (schatting)','batterij (1-5)','batterij','hoofd','bloeding','medicatie','speelde mee','gelukt','notitie'];
  var q = function(v){ v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  var lines = [head.join(';')];
  Object.keys(data.entries).sort().forEach(function(d){
    var e = data.entries[d], past = starts.filter(function(s){ return s <= d; }), cd = '', ph = '';
    if(past.length){ cd = diff(past[past.length-1], d) + 1; ph = PHASES[phaseFor(cd, stats.len, isBleeding(e))].name; }
    var f = FOCUS.filter(function(x){ return x.id === e.focus; })[0];
    lines.push([d, cd, ph, e.energy||'', e.energy?energyName(e.energy):'', f?f.name:'', e.bleeding||'', e.meds||'', (e.tags||[]).join(', '), e.win||'', e.note||''].map(q).join(';'));
  });
  return '\ufeff' + lines.join('\n');
}

/* ---------- interactie ---------- */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if(!b) return;
  flushInput();
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  var e = entry(selDate);
  switch(act){
    case 'view': view = v; if(v === 'month') monthCursor = selDate.slice(0,7); render(); window.scrollTo(0,0); break;
    case 'day': var nd = addDays(selDate, +b.getAttribute('data-n')); if(nd <= todayStr()){ selDate = nd; render(); } break;
    case 'gotoday': selDate = todayStr(); render(); break;
    case 'open': selDate = v; view = 'today'; render(); window.scrollTo(0,0); break;
    case 'month':
      var y = +monthCursor.slice(0,4), m = +monthCursor.slice(5,7) - 1 + (+b.getAttribute('data-n'));
      var dt = new Date(y, m, 1); monthCursor = dt.getFullYear() + '-' + pad(dt.getMonth()+1); render(); break;
    case 'energy': setEntry(selDate, {energy: e.energy === +v ? null : +v}); rerenderKeepScroll(); break;
    case 'focus': setEntry(selDate, {focus: e.focus === v ? null : v}); rerenderKeepScroll(); break;
    case 'bleed': setEntry(selDate, {bleeding: e.bleeding === v ? null : v}); rerenderKeepScroll(); break;
    case 'meds': setEntry(selDate, {meds: e.meds === v ? null : v}); rerenderKeepScroll(); break;
    case 'tag':
      var tags = (e.tags||[]).slice(), i = tags.indexOf(v);
      if(i > -1) tags.splice(i,1); else tags.push(v);
      setEntry(selDate, {tags:tags}); rerenderKeepScroll(); break;
    case 'help':
      var el = document.getElementById(v); el.hidden = !el.hidden; b.setAttribute('aria-expanded', String(!el.hidden)); b.textContent = el.hidden ? 'uitleg' : 'verberg uitleg'; break;
    case 'setlps':
      var inp = document.getElementById('lps');
      if(!inp.value){ toast('Kies eerst een datum'); inp.focus(); return; }
      data.settings.lastPeriodStart = inp.value; persist(); render(); toast('Opgeslagen'); break;
    case 'exportjson': download('focusflow-tracker-backup-' + todayStr() + '.json', JSON.stringify(data, null, 2), 'application/json'); break;
    case 'exportcsv': download('focusflow-tracker-' + todayStr() + '.csv', toCSV(), 'text/csv;charset=utf-8'); break;
    case 'importjson': document.getElementById('importfile').click(); break;
    case 'wipe':
      if(confirm('Weet je het zeker? Al je check-ins en instellingen worden gewist van dit toestel. Dit kan je niet ongedaan maken.')){
        data = { version:1, settings:Object.assign({}, DEFAULTS.settings), entries:{} };
        try { localStorage.removeItem(KEY); } catch(x){}
        onbStep = 0; view = 'today'; selDate = todayStr(); render();
      }
      break;
    case 'replay': data.settings.onboarded = false; onbStep = 0; render(); break;
    case 'onbnext':
      if(onbStep === 1){
        if(onbChoice === 'weet'){
          var od = document.getElementById('onblps').value;
          if(!od){ toast('Kies een datum, of kies "ik weet het niet precies"'); return; }
          data.settings.lastPeriodStart = od; data.settings.noCycle = false;
        } else if(onbChoice === 'geen'){ data.settings.noCycle = true; }
        else { data.settings.noCycle = false; }
      }
      onbStep++; render(); break;
    case 'onbback': onbStep = Math.max(0, onbStep-1); render(); break;
    case 'onbdone': data.settings.onboarded = true; persist(); view = 'today'; selDate = todayStr(); render(); break;
  }
});
function rerenderKeepScroll(){
  var y = window.scrollY, focusedAct = document.activeElement && document.activeElement.getAttribute('data-act'),
      focusedV = document.activeElement && document.activeElement.getAttribute('data-v');
  var detailsOpen = !!document.querySelector('details.more[open] .field');
  var phaseOpen = document.querySelector('.cycle') && document.querySelector('.cycle').parentNode.querySelector('details.more[open]');
  var msg = document.getElementById('savedState') ? document.getElementById('savedState').textContent : '';
  var openHelp = Array.prototype.filter.call(document.querySelectorAll('dl.help'), function(x){ return !x.hidden; }).map(function(x){ return x.id; });
  render();
  openHelp.forEach(function(id){ var el = document.getElementById(id); if(el){ el.hidden = false; var btn = document.querySelector('[data-act="help"][data-v="'+id+'"]'); if(btn){ btn.textContent = 'verberg uitleg'; btn.setAttribute('aria-expanded','true'); } } });
  if(detailsOpen){ var d = document.querySelectorAll('details.more'); d[d.length-1].open = true; }
  if(phaseOpen){ var pd = document.querySelector('.cycle').parentNode.querySelector('details.more'); if(pd) pd.open = true; }
  var s = document.getElementById('savedState'); if(s) s.textContent = msg;
  window.scrollTo(0, y);
  if(focusedAct){ var f = document.querySelector('[data-act="'+focusedAct+'"][data-v="'+(focusedV||'')+'"]'); if(f) f.focus({preventScroll:true}); }
}

document.addEventListener('change', function(ev){
  var t = ev.target;
  if(t.name === 'onb'){ onbChoice = t.value; var od = document.getElementById('onbdate'); if(od) od.hidden = onbChoice !== 'weet'; return; }
  if(t.hasAttribute('data-toggle')){ data.settings[t.getAttribute('data-toggle')] = t.checked; persist(); render(); return; }
  if(t.hasAttribute('data-set')){
    var key = t.getAttribute('data-set');
    if(key === 'cycleLength'){ var n = parseInt(t.value,10); if(!(n >= 18 && n <= 60)){ toast('Kies een duur tussen 18 en 60 dagen'); t.value = data.settings.cycleLength; return; } data.settings.cycleLength = n; }
    else data.settings[key] = t.value || null;
    persist(); toast('Opgeslagen'); return;
  }
  if(t.id === 'importfile' && t.files && t.files[0]){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var obj = JSON.parse(reader.result);
        if(!obj || typeof obj.entries !== 'object' || typeof obj.settings !== 'object') throw new Error('ongeldig');
        if(!confirm('Deze back-up vervangt wat nu op dit toestel staat. Doorgaan?')) return;
        data = { version:1, settings:Object.assign({}, DEFAULTS.settings, obj.settings, {onboarded:true}), entries:obj.entries };
        persist(); render(); toast('Back-up teruggezet');
      } catch(err){ toast('Dit bestand is geen geldige tracker-back-up'); }
    };
    reader.readAsText(t.files[0]);
    t.value = '';
  }
});
var inputTimer, pending = null;
function flushInput(){ clearTimeout(inputTimer); if(pending){ var p = {}; p[pending.key] = pending.val.trim() ? pending.val : null; var d = pending.date; pending = null; setEntry(d, p); } }
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(!t.hasAttribute('data-input')) return;
  pending = {key:t.getAttribute('data-input'), val:t.value, date:selDate};
  clearTimeout(inputTimer);
  inputTimer = setTimeout(flushInput, 500);
});

render();
})();
</script>
</body>
